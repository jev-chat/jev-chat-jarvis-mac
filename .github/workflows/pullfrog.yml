# Pullfrog agent：自动评审的派发入口 + 控制台「Review」按钮 / 手动 dispatch。
#
# PR 的自动评审由 Pullfrog 控制台的 Reviews → Auto-review 驱动（一直启用）：
# 服务端在新 PR open / ready / 新 commit 推送时，以 workflow_dispatch 派发本
# workflow（run 名「Review #N」，**ref 是 master**——本文件的改动要合并后才
# 会被后续 dispatch 用到，PR 内无法自验证）并自动填好 prompt，评审结论由
# 服务端以 pullfrog[bot] App 身份提交。所以本文件只需保住 workflow_dispatch
# 入口的契约，不要加自动触发器——此前手工挂过 workflow_run 跟进 CI 的路径
# 从未成功过：pullfrog action 运行时硬性要求 prompt 与 prompt_file 二选一
# （action.yml："Set exactly one of prompt or prompt_file"），而 workflow_run
# 事件没有 inputs，inputs.prompt 展开为空直接失败（上线以来 24 个 run 0 成功，
# 只会往 Actions 页面堆假红）。官方文档明说："If you want auto PR review ...
# don't copy a workflow from here — those are first-class Pullfrog features
# configured in the console."
#
# 凭据模型（实测过，别破坏）：
# - agent 凭据由 Pullfrog 服务端持有：job 的 id-token: write 是 pullfrog action
#   走 OIDC 向 pullfrog.com 认证用的，**别删**。本仓库与同类仓库 secrets 全空、
#   agent 照常评审（服务端配的 provider，如 DeepSeek Pro）。
# - 因此**不要**往 env 里加 provider API key：那会把 key 注入到跑在 PR 代码
#   上下文里的 agent，服务端持钥没有这个暴露面。
# - checkout 用 dispatch 载荷指定的 ref（控制台按钮发的是 PR merge ref），
#   **不要改成 fork PR 的 head 代码**。PR 内容对 agent 仍是不可信输入
#   （prompt 注入面）。github.token 只进 Checkout 步骤；Run agent 步骤
#   **不放 GH_TOKEN**，否则评审署名从 pullfrog[bot] 变 github-actions[bot]
#   （实测对照，见该步骤注释）。
# - prompt 契约（官方硬校验）：with.prompt 必须**原样**写 `${{ inputs.prompt }}`，
#   不能拼进 env 再传——控制台 dispatch 时会把评审指令填进 inputs.prompt，
#   action 从 dispatch 载荷恢复 PR 上下文。评审指引放 Pullfrog 控制台的
#   Standing instructions（输出锁中文也在那里配），不放在本文件。
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
        required: false
      name:
        type: string
        description: Run name

# dispatch 各发各的，run_id 独占一组——不能用 github.ref 兜底，否则所有
# dispatch 都落在 master 同一组里，后发的评审会把在跑的直接取消
# （实测：连续 Review #96/#97/#98 互杀）
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write       # pullfrog action 服务端认证（见文件头「凭据模型」）
      contents: read
      # 注意：不要给 GITHUB_TOKEN 加 issues/pull-requests 写权限（panta-log
      # 官方模板也没有）。给了它 action 就自己提交评审——署名落到
      # github-actions[bot] 头上；保持只写 id-token + 读 contents，
      # 评审只能由服务端以 pullfrog[bot] App 身份提交（2026-09-26 实测对照）。
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
          git checkout -q FETCH_HEAD

      - name: Run agent
        uses: pullfrog/pullfrog@v0
        # 契约：必须原样 ${{ inputs.prompt }}，评审指引在 Pullfrog 控制台的
        # Standing instructions 里（见文件头）。
        with:
          prompt: ${{ inputs.prompt }}
          # disabled 只压「运行中任务清单」的实时更新；「Leaping into action...」
          # 开工评论由服务端在派发 workflow 前发布、不读本 YAML，这里拦不住
          # （action.yml 官方说明，715193c 的旧注释理解反了）。
          # 要拦只能走 Pullfrog 控制台 Agent → Comments → Progress comments
          # （2026-09 已关掉；PR 页面不应再出现 pullfrog[bot] 评论被删的记录）。
          progress_comments: disabled
        env:
          # 不要在这里设 GH_TOKEN（2026-09-26 实测对照 panta-log）：设了 action
          # 就用 GITHUB_TOKEN——github-actions[bot] 身份——提交评审；不设时走
          # id-token OIDC 由服务端以 pullfrog[bot] App 身份提交（官方模板
          # 「DO NOT EDIT」形态即不设，评审署名是 frog）。checkout 的 token
          # 只属于上面 Checkout 步骤。
          # 也不放 provider key：凭据由 Pullfrog 服务端持有（见文件头「凭据模型」）
